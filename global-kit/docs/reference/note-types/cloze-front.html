<h1 class="topic">Topic</h1>

<main class="card-inner card-front">
  <section class="input-container is-primary">
    <div class="question">{{cloze:Cloze Question}}</div>
    <div class="type-hint">{{Type Hint}}</div>
    <textarea class="input-answer tappable is-cloze" data-compare="true" type="text"></textarea>
  </section>

  <section class="input-container is-bonus">
    <div class="question">{{Bonus Question}}</div>
    <div class="type-hint">{{Bonus Type Hint}}</div>
    <textarea class="input-answer tappable" data-compare="{{Bonus Compare}}" type="text"></textarea>
  </section>
</main>

<script>
  var injectScript = (src) => {
    return new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = src;
      script.async = true;
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  };
  (async () => {
    // Check if the scripts already exists in order to prevent duplicate loading
    if (typeof hasDiffMatchScript === "undefined") {
      await injectScript("_diff_match_patch.js");
    }
    if (typeof hasMyCustomScript === "undefined") {
      await injectScript("_global.js");
    }
  })();
</script>
